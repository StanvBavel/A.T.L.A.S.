<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.L.A.S. HUD</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/hud.css">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- MediaPipe Hands (Legacy/JS version for simple integration) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="hologram-overlay">
        <div id="three-canvas-container"></div>
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="mediapipe-canvas" style="display:none;"></canvas>
    </div>

    <div id="hud-container">

        <div id="core-status" class="status-standby">
            <div class="atlas-core-container">
                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <div class="core-ring ring-3"></div>
                <div class="core-text">A.T.L.A.S.</div>
            </div>
            <p id="status-text">SYSTEM ONLINE / STANDBY</p>
        </div>

        <div class="layout-row">
            <div id="log-container"></div>

            <div id="widgets-container">
                <div class="widget">
                    <h3>SYSTEM MEMORY</h3>
                    <div id="ram-value" class="widget-value">-- GB</div>
                </div>
                <div class="widget">
                    <h3>CPU LOAD</h3>
                    <div id="cpu-value" class="widget-value">-- %</div>
                </div>
                <div class="widget">
                    <h3>TIME</h3>
                    <div id="time-value" class="widget-value">--:--:--</div>
                </div>
            </div>

            <div id="image-viewer">
                <div class="widget-header">VISUAL DATA RECEIVED</div>
                <img id="image-viewer-img" src="" alt="A.T.L.A.S. Visual Data" />
            </div>
        </div>

        <div id="input-container">
            <button id="mic-button">🎤 MIC</button>
            <input type="text" id="chat-input" placeholder="Initialize command sequence..." autocomplete="off" />
            <button id="send-button">EXECUTE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/signalr-client.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/main.js"></script>
    <script src="js/hologram.js"></script>
</body>
</html>
