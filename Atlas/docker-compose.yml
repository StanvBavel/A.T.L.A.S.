version: '3.8'

services:
  # Python Image Generation Service
  atlas_image_service:
    build:
      context: ./src/AI.ImageService
      dockerfile: Dockerfile
    container_name: atlas_image_service
    ports:
      - "8000:8000"
    volumes:
      - ./hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - atlas_net

  # Python 3D Generation Service (Shap-E)
  atlas_3d_service:
    build:
      context: ./src/AI.HologramService
      dockerfile: Dockerfile
    container_name: atlas_3d_service
    ports:
      - "5000:5000"
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./shap_e_cache:/root/.cache/shap-e
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - atlas_net

networks:
  atlas_net:
    driver: bridge
